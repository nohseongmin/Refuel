name: ios-build

# Builds the iOS app on a GitHub macOS runner, so no Mac of your own is needed.
# By default this only proves the code compiles, with no signing.
# A real IPA or TestFlight upload needs Apple Developer certificates in secrets.
# See IOS_GUIDE.md.

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle web assets and install dependencies
        run: |
          rm -rf www && mkdir -p www && cp -r ../docs/* www/
          npm install
          npx cap sync ios

      - name: Install CocoaPods
        working-directory: android-app/ios/App
        run: pod install

      - name: Build iOS without signing
        working-directory: android-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Result
        run: echo "iOS compile succeeded. Shipping still needs Apple certificates, see IOS_GUIDE.md."
