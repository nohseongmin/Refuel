name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name Refuel
          --collect-all pystray --collect-all PIL --collect-all winotify
          --collect-all qrcode run.py

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Refuel ${{ github.ref_name }}
          files: dist/Refuel.exe
          body: |
            Refuel ${{ github.ref_name }} (pre-1.0)

            Single-file Windows build. Download and double-click.
            No server and no account; it only reads local logs.
