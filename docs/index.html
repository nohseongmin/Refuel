<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Refuel</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f14">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Refuel">
<style>
:root{--bg:#0d0f14;--panel:#141821;--card:#11151d;--bd:#252c3a;--track:#0a0c11;
--tx:#e7eaf0;--mut:#8a93a4;--acc:#46e08a;--warn:#f5c451;--dng:#f3766b;--blu:#5a8dee;
/* Five grass shades, scaled by usage against the estimated 5-hour limit */
--g0:#161b26;--g1:#d9f99d;--g2:#a3e635;--g3:#65d64f;--g4:#3aba48;--g5:#1a9c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
padding:max(16px,env(safe-area-inset-top)) 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-weight:700;font-size:17px;color:var(--acc)}
.meta{font-size:11px;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.aname{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.count{font-size:40px;font-weight:700;font-family:Consolas,monospace;letter-spacing:1px;margin:6px 0 2px}
.sub{font-size:11px;color:var(--mut);line-height:1.6}
.bar{height:7px;background:var(--track);border-radius:5px;overflow:hidden;margin:10px 0 4px}
.fill{height:100%;width:0%;background:var(--acc);transition:width .4s}
.days{margin-top:10px}
.drow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:10px}
.drow .dl{width:52px;color:var(--mut)}
.drow .dt{flex:1;height:6px;background:var(--track);border-radius:4px;overflow:hidden}
.drow .df{height:100%;background:var(--blu)}
.drow .dv{width:44px;text-align:right;color:var(--mut);font-family:Consolas,monospace}
.streak{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:var(--acc)}
.streak .off{color:var(--mut);font-weight:400}
/* Fills the card width, with cell size following from it. Capped on wide screens. */
.grass{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);
grid-auto-columns:minmax(0,1fr);gap:2px;margin-top:6px;width:100%;max-width:520px}
.grass i{aspect-ratio:1;border-radius:2px;background:var(--g0)}
.grass i.l1{background:var(--g1)}
.grass i.l2{background:var(--g2)}
.grass i.l3{background:var(--g3)}
.grass i.l4{background:var(--g4)}
.grass i.l5{background:var(--g5)}
.legend{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;color:var(--mut)}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
.setup{background:var(--panel);border:1px dashed var(--bd);border-radius:14px;padding:16px;font-size:13px;line-height:1.9}
.setup code{background:var(--card);padding:2px 6px;border-radius:6px;font-size:11px;word-break:break-all}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;
padding:8px 14px;font-size:12px;margin-top:8px}
a{color:var(--blu)}
.stale{color:var(--warn)}
</style></head><body>
<div class="top"><div class="brand">● Refuel</div><div style="display:flex;align-items:center;gap:10px"><div class="meta" id="meta">--</div><button id="gear" title="Settings" style="background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:2px 4px;line-height:1">⚙</button></div></div>
<div id="root"></div>
<script src="jsqr.min.js"></script>
<script>
// ---- Theme: every colour comes from one accent, matching theme() on the PC ----
// The hue stays fixed and meaning is carried by lightness and saturation, so picking
// blue turns warnings, danger and the grass blue too.
const ACC_DEFAULT='#49df94';
function hueOf(hex){
 const m=/^#?([0-9a-f]{6})$/i.exec(String(hex)||'');
 if(!m)return hueOf(ACC_DEFAULT);
 const n=parseInt(m[1],16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
 const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
 if(!d)return 0;
 let h; if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4;
 return ((h*60)%360+360)%360/360;
}
function shade(h,l,s){                       // HSL -> #rrggbb, same maths as colorsys.hls_to_rgb on the PC
 const f=n=>{const k=(n+h*12)%12, a=s*Math.min(l,1-l);
  return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};
 return '#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyTheme(acc){
 acc=/^#?[0-9a-f]{6}$/i.test(String(acc)||'')?acc:ACC_DEFAULT;
 if(applyTheme.last===acc)return; applyTheme.last=acc;
 localStorage.rf_acc=acc;
 const h=hueOf(acc), r=document.documentElement.style;
 r.setProperty('--acc',acc);
 r.setProperty('--warn',shade(h,0.70,0.90));
 r.setProperty('--dng',shade(h,0.82,1.00));
 r.setProperty('--blu',shade(h,0.45,0.60));
 r.setProperty('--g0',shade(h,0.11,0.15));
 for(let i=0;i<5;i++)r.setProperty('--g'+(i+1),shade(h,0.22+i*0.10,0.40+i*0.12));
}
applyTheme(localStorage.rf_acc||ACC_DEFAULT);   // paint with the saved colour before any PC status arrives

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const P=new URLSearchParams(location.hash.slice(1));
if(P.get('t')){localStorage.rf_t=P.get('t');if(P.get('k'))localStorage.rf_k=P.get('k');
 if(P.get('sv'))localStorage.rf_sv=P.get('sv');history.replaceState(null,'',location.pathname);}
const T=localStorage.rf_t, K=localStorage.rf_k, SV=localStorage.rf_sv||'https://ntfy.sh';
const DEMO = P.get('demo')!==null;   // sample data only on an explicit #demo; unpaired shows the connect screen
const PAIRED = !!(T && K);
let state=null, lastFetch=0, cryptoKey=null;
function demoState(){
 const now=Date.now()/1000, day=86400, base=new Date();
 const sampleM=[69,31,22,88,14,52,20], daily=[];
 for(let i=6;i>=0;i--){const d=new Date(base);d.setDate(d.getDate()-i);
  daily.push([d.toISOString().slice(0,10), sampleM[6-i]*1e6]);}
 const N=112, from=new Date(base);from.setDate(from.getDate()-(N-1));
 let lv='';                       // sample grass: sparse early on, then 12 solid recent days
 for(let i=0;i<N;i++)lv+= i>=N-12 ? String(3+(i%3)) : (i%3===0?'0':String(1+(i%5)));
 return {ts:now, total_events:1287, accent:localStorage.rf_acc||ACC_DEFAULT, agents:[{
  id:'claude-code', name:'Claude Code', today:20450000, week:174000000,
  block:{reset:now+2*3600+15*60+30, tok:3585015, ratio:0.45},
  wk:{reset:now+3*day+4*3600, ratio:0.62}, daily,
  streak:{current:12, best:23, from:from.toISOString().slice(0,10), levels:lv}}]};
}

// ---- Diagnostic log ----
// The topic and encryption key are never logged, so sharing a log cannot hand over
// the channel.
const LOG_MAX=300, LOG_KEY='rf_log';
const pollState={ok:null,badLogged:false};   // only log on a state change, to avoid spam
let LOG=[];
try{LOG=JSON.parse(localStorage.getItem(LOG_KEY)||'[]')}catch(e){LOG=[]}
function rlog(level,msg){
 LOG.push({t:new Date().toISOString(),l:level,m:String(msg).slice(0,400)});
 if(LOG.length>LOG_MAX)LOG=LOG.slice(-LOG_MAX);
 try{localStorage.setItem(LOG_KEY,JSON.stringify(LOG))}catch(_){}
 (level==='error'?console.error:console.log)('[refuel]',msg);
 const b=$('#logbox');if(b)b.textContent=logTail();
}
function logTail(n=40){
 return LOG.slice(-n).map(e=>`[${e.t.slice(11,19)}] ${e.l[0].toUpperCase()} ${e.m}`).join('\n')||'(no entries)';
}
function logReport(){
 const Cap=window.Capacitor, native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
 return ['Refuel diagnostic log',
  'Generated: '+new Date().toLocaleString(),
  'Runtime: '+(native?'native app':'web')+' / mode: '+(DEMO?'demo':'live'),
  'Paired: '+(T?'yes':'no')+' · key: '+(K?'yes':'no')+' · relay: '+SV,
  'UA: '+navigator.userAgent,
  'Entries: '+LOG.length,
  '─────────────────────────',
  LOG.map(e=>`[${e.t.slice(0,19).replace('T',' ')}] ${e.l.toUpperCase()} ${e.m}`).join('\n')
 ].join('\n');
}
window.addEventListener('error',e=>rlog('error','uncaught: '+(e.message||'')+' @'+(e.filename||'').split('/').pop()+':'+(e.lineno||'')));
window.addEventListener('unhandledrejection',e=>rlog('error','unhandled: '+((e.reason&&e.reason.message)||e.reason)));
if(P.get('t'))rlog('info','QR pairing saved');

// ---- In-app QR scanner, so pairing needs no other app ----
function applyPairing(text){
 const i=String(text).indexOf('#');
 const p=new URLSearchParams(i>=0?text.slice(i+1):'');
 if(!p.get('t')){rlog('warn','QR has no pairing info');alert('That is not a Refuel pairing QR.');return false;}
 localStorage.rf_t=p.get('t');
 if(p.get('k'))localStorage.rf_k=p.get('k');
 if(p.get('sv'))localStorage.rf_sv=p.get('sv');
 rlog('info','paired - reloading');
 location.reload();
 return true;
}
async function startScan(){
 if(typeof jsQR!=='function'){rlog('error','QR decoder not loaded');alert('Could not load the scanner.');return;}
 rlog('info','QR scan started');
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}
 catch(e){rlog('error','camera access failed: '+(e&&e.message||e));alert('Could not open the camera. Allow camera access in the app settings.');return;}
 const ov=document.createElement('div');
 ov.style.cssText='position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px';
 const v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;
 v.style.cssText='width:88%;max-width:420px;border-radius:16px';v.srcObject=stream;
 const hint=document.createElement('div');hint.textContent='Point at the QR on your PC screen';
 hint.style.cssText='color:#e7eaf0;font-size:15px';
 const cancel=document.createElement('button');cancel.textContent='Cancel';
 cancel.style.cssText='background:#141821;color:#e7eaf0;border:1px solid #252c3a;border-radius:10px;padding:10px 22px;font-size:14px';
 ov.append(hint,v,cancel);document.body.append(ov);
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 let stop=false;
 const close=()=>{stop=true;stream.getTracks().forEach(t=>t.stop());ov.remove();};
 cancel.onclick=()=>{rlog('info','QR scan cancelled');close();};
 try{await v.play();}catch(_){}
 (function tick(){
  if(stop)return;
  if(v.readyState>=2&&v.videoWidth){
   cv.width=v.videoWidth;cv.height=v.videoHeight;
   cx.drawImage(v,0,0,cv.width,cv.height);
   let code=null;try{const im=cx.getImageData(0,0,cv.width,cv.height);code=jsQR(im.data,im.width,im.height);}catch(_){}
   if(code&&code.data){rlog('info','QR recognised');close();applyPairing(code.data);return;}
  }
  requestAnimationFrame(tick);
 })();
}
const fmtN=v=>num(v).toLocaleString('en-US');
const fmtS=v=>{v=num(v);return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'K':''+v};
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WINDOW_SEC=18000, WEEK_SEC=7*86400; // 5-hour and weekly windows in seconds, matching core.py on the PC
function dur(s){if(s==null)return'--:--:--';s=Math.max(0,Math.floor(s));
 const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
 const b=[h,m,x].map(v=>String(v).padStart(2,'0')).join(':');return d?d+'d '+b:b}
async function getKey(){
 if(cryptoKey||!K)return cryptoKey;
 const raw=new Uint8Array(K.match(/.{2}/g).map(h=>parseInt(h,16)));
 cryptoKey=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return cryptoKey;
}
async function decrypt(msg){
 if(!msg.startsWith('enc1:'))throw new Error('not encrypted');
 const raw=Uint8Array.from(atob(msg.slice(5)),c=>c.charCodeAt(0));
 const key=await getKey();if(!key)throw new Error('no key');
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
 return JSON.parse(new TextDecoder().decode(pt));
}
// Grass: turns the "0112..." string from the PC into a GitHub-style grid.
// Columns are weeks, rows are weekdays from Monday.
function grassHTML(st){
 const lv=st&&st.levels;if(!lv)return'';
 const d0=new Date((st.from||'')+'T00:00:00');if(isNaN(d0))return'';
 const pad=(d0.getDay()+6)%7;                    // blank the first column up to the starting weekday
 let cells='';
 for(let i=0;i<pad;i++)cells+='<i style="visibility:hidden"></i>';
 for(const c of lv)cells+=`<i class="l${Math.min(5,Math.max(0,Number(c)||0))}"></i>`;
 const cur=num(st.current), best=num(st.best);
 const sw=[1,2,3,4,5].map(i=>`<b style="background:var(--g${i})"></b>`).join('');
 return `<div class="streak">${cur?`🔥 <span>${cur} day streak</span>`:'<span class="off">No active streak</span>'}
   <span class="off">· best ${best}</span></div>
  <div class="grass">${cells}</div>
  <div class="legend">Less${sw}More · brighter means closer to the limit</div>`;
}
function agentCardsHTML(agents){
 const now=Date.now()/1000;
 if(!agents.length)return `<div class="setup">No agents detected yet. Use an AI tool on your PC and it will show up here.</div>`;
 return agents.map(a=>{
  const name=esc(a.name||a.id||'?');
  let count='Refueled',col='var(--acc)',prog=0,ratio=null,sub='No active window · ready to go';
  const bReset=a.block?num(a.block.reset):0, wkReset=(a.wk&&a.wk.reset)?num(a.wk.reset):0;
  const wkRatio=(a.wk&&a.wk.ratio!=null)?num(a.wk.ratio):null;
  if(a.block&&bReset>now){
   const rem=bReset-now;ratio=a.block.ratio==null?null:num(a.block.ratio);
   col=(ratio!=null&&ratio>=0.8)?'var(--dng)':(rem<=1800?'var(--warn)':'var(--acc)');
   count=dur(rem);prog=Math.min(1,(WINDOW_SEC-rem)/WINDOW_SEC);
   const t=new Date(bReset*1000);
   sub=`5h reset ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} · window ${fmtN(a.block.tok)} tokens`+(ratio!=null?` · est. ${Math.round(ratio*100)}%`:'');
  }else if(wkRatio!=null&&wkRatio>=0.8&&wkReset>now){
   const rem=wkReset-now;col='var(--dng)';count=dur(rem);prog=1-rem/WEEK_SEC;
   sub='Weekly limit reached - waiting for reset';
  }
  let wkline='';
  if(wkReset){const wd=new Date(wkReset*1000);
   wkline=`Weekly ${fmtN(a.week)} tokens · resets ${WD[(wd.getDay()+6)%7]} ${String(wd.getHours()).padStart(2,'0')}:${String(wd.getMinutes()).padStart(2,'0')}`+(wkRatio!=null?` · est. ${Math.round(wkRatio*100)}%`:'');}
  const daily=(Array.isArray(a.daily)?a.daily:[]).map(d=>[String(d[0]),num(d[1])]);
  const mx=Math.max(...daily.map(d=>d[1]),1);
  const days=daily.slice().reverse().map(d=>{
   const dt=new Date(d[0]+'T00:00:00');
   const lbl=isNaN(dt)?'--':`${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${WD[(dt.getDay()+6)%7]}`;
   return `<div class="drow"><div class="dl">${lbl}</div><div class="dt"><div class="df" style="width:${(d[1]/mx*100).toFixed(0)}%"></div></div><div class="dv">${fmtS(d[1])}</div></div>`}).join('');
  // The grass is the centrepiece: full width right under the countdown, figures below.
  return `<div class="card"><div class="aname"><span>${name}</span></div>
   <div class="count" style="color:${col}" data-reset="${a.block?bReset:''}">${count}</div>
   ${grassHTML(a.streak)}
   <div class="sub">${sub}</div><div class="bar"><div class="fill" style="width:${(prog*100).toFixed(1)}%;background:${col}"></div></div>
   <div class="sub">Today ${fmtN(a.today)} tokens</div>
   <div class="sub">${wkline}</div>
   <div class="days">${days}</div></div>`}).join('');
}
function connectHTML(){
 return `<div class="setup"><b>Connect to your PC</b><br>
   Pair once with Refuel on your PC to see your token usage.<br><br>
   1. Install and run <a href="https://github.com/nohseongmin/Refuel/releases/latest" target="_blank" rel="noopener noreferrer">Refuel for Windows</a><br>
   2. On the PC, click the gear icon and choose <b>Pair with QR</b><br>
   3. Scan that QR with the button below<br>
   <button id="scanbtn" style="background:var(--acc);color:#0d0f14;border:0;font-weight:700;padding:14px;font-size:15px;width:100%;margin-top:8px">📷 Scan QR to connect</button>
   <button id="demobtn" style="width:100%">See a demo</button>
   <span style="color:var(--mut);font-size:11px;display:block;margin-top:8px">By using this app you agree to the <a href="https://github.com/nohseongmin/Refuel/blob/main/DISCLAIMER.md" target="_blank" rel="noopener noreferrer">disclaimer</a>.</span></div>`;
}
function wireCommon(){
 const sc=$('#scanbtn');if(sc)sc.onclick=startScan;
 const db=$('#demobtn');if(db)db.onclick=()=>{location.hash='demo';location.reload();};
}
function render(){
 const r=$('#root');
 if(DEMO){
  r.innerHTML=agentCardsHTML(Array.isArray(state&&state.agents)?state.agents:[])
   +`<div class="setup"><b>🎬 Demo · sample data</b><br>Connect to your PC to see real data.
     <button id="scanbtn" style="width:100%;margin-top:6px">📷 Scan QR to connect</button></div>`;
  wireCommon();return;
 }
 if(!PAIRED){$('#meta').textContent='Not connected';r.innerHTML=connectHTML();wireCommon();return;}
 if(!state){r.innerHTML=`<div class="setup"><b>Waiting for data…</b><br>Make sure Refuel is running on your PC and <b>Phone sync</b> is on in ⚙.</div>`;return;}
 r.innerHTML=agentCardsHTML(Array.isArray(state.agents)?state.agents:[]);
}

// ---- Local alerts. The phone schedules them itself, so they ring at reset time
// even with the PC off, and no ntfy app is needed. ----
const CH='refuel_reset';
function nativeLN(){const C=window.Capacitor;return (C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.LocalNotifications)?C.Plugins.LocalNotifications:null;}
// Recreate the channel only when the sound or vibration setting changes. Deleting a
// channel also clears alerts already shown through it, so rebuilding it every time
// could wipe the reset alert the user is looking at.
let chanSig='';
async function ensureChannel(){
 const LN=nativeLN();if(!LN)return;
 const sound=localStorage.rf_sound!=='0', vibe=localStorage.rf_vibe!=='0';
 const sig=(sound?'1':'0')+(vibe?'1':'0');
 if(sig===chanSig)return; chanSig=sig;
 try{await LN.deleteChannel({id:CH})}catch(_){}
 try{await LN.createChannel({id:CH,name:'Refuel alerts',description:'Token limit reset',importance:sound?5:2,vibration:vibe,visibility:1,lights:true,lightColor:'#46e08a'});}
 catch(e){chanSig='';rlog('warn','channel creation failed: '+e)}
}
async function ensurePerm(){
 const LN=nativeLN();if(!LN)return false;
 try{let p=await LN.checkPermissions();if(p.display!=='granted'){p=await LN.requestPermissions();}return p.display==='granted';}
 catch(e){rlog('warn','permission check failed: '+e);return false;}
}
// Alert id ranges: 100-999 are reset schedules, rewritten each time, and 1000+ are
// one-off alerts such as PC alerts and tests.
const RESET_ID_MIN=100, RESET_ID_MAX=999;
let lastSchedSig='';
async function scheduleLocalNotifs(agents,force){
 const LN=nativeLN();if(!LN)return;
 const enabled=localStorage.rf_notif!=='0', now=Date.now();
 const items=(agents||[]).filter(a=>a.block&&num(a.block.reset)*1000>now+5000)
   .map(a=>({name:(a.name||''),at:num(a.block.reset)*1000}));
 const sig=(enabled?'1':'0')+'|'+(localStorage.rf_sound||'1')+(localStorage.rf_vibe||'1')+'|'+items.map(i=>i.name+i.at).join(',');
 if(!force&&sig===lastSchedSig)return; lastSchedSig=sig;
 // Clear only the reset schedules. Cancelling the one-offs too would drop a PC alert
// that is about to be shown.
 try{const pend=(await LN.getPending()).notifications||[];
  const mine=pend.filter(n=>n.id>=RESET_ID_MIN&&n.id<=RESET_ID_MAX).map(n=>({id:n.id}));
  if(mine.length)await LN.cancel({notifications:mine});}catch(_){}
 if(!enabled){rlog('info','alerts off - nothing scheduled');return;}
 if(!items.length)return;
 if(!await ensurePerm()){rlog('warn','no notification permission - scheduling cancelled');return;}
 await ensureChannel();
 let id=RESET_ID_MIN;
 // allowWhileIdle fires during Doze. Without it a sleeping phone with the app closed
 // stays silent.
 const notifs=items.map(i=>({id:id++,title:i.name+' refueled',body:'Your 5-hour usage limit has reset.',
   channelId:CH,schedule:{at:new Date(i.at),allowWhileIdle:true}}));
 try{
  await LN.schedule({notifications:notifs});
  let pend=0;try{pend=((await LN.getPending()).notifications||[]).length;}catch(_){}
  rlog('info','scheduled '+notifs.length+' local alert(s) ('+pend+' pending) · reset '+new Date(items[0].at).toLocaleString());
 }catch(e){rlog('error','local alert scheduling failed: '+(e&&e.message||e));}
}
// Shows alerts the PC sent just now, such as tests and update notices, while the app
// is open. Reset alerts are skipped because the phone schedules those itself and would
// otherwise ring twice.
const ALERT_SEEN='rf_alert_seen', LIVE_TAG='refuel-live';
const alertState={ok:null};   // only log on a state change, to avoid spam
async function showNow(title,body){
 const LN=nativeLN();
 if(LN){
  try{if(!await ensurePerm())return; await ensureChannel();
   await LN.schedule({notifications:[{id:1000+Math.floor(Math.random()*8000),title,body,
     channelId:CH,schedule:{at:new Date(Date.now()+300)}}]});
   rlog('info','showing PC alert: '+title);}
  catch(e){rlog('error','failed to show PC alert: '+(e&&e.message||e));}
 }else if('Notification'in window&&Notification.permission==='granted'){
  try{new Notification(title,{body})}catch(_){}
 }
}
async function pollAlerts(){
 if(!T||localStorage.rf_notif==='0')return;
 try{
  const res=await fetch(`${SV}/${encodeURIComponent(T)}-a/json?poll=1&since=15m`,{cache:'no-store'});
  const lines=(await res.text()).trim().split('\n').filter(Boolean);
  const seen=num(localStorage[ALERT_SEEN]), first=!seen;
  let maxT=seen; const fresh=[];
  for(const ln of lines){
   let m;try{m=JSON.parse(ln)}catch(_){continue}
   if(m.event!=='message')continue;
   const t=num(m.time); if(t>maxT)maxT=t;
   if(first||t<=seen)continue;                       // the first run only sets the watermark, so history is not replayed
   if(!(m.tags||[]).includes(LIVE_TAG))continue;     // scheduled reset alerts are rung by the phone itself
   fresh.push(m);
  }
  if(maxT>seen)localStorage[ALERT_SEEN]=String(maxT);
  alertState.ok=true;
  for(const m of fresh)await showNow(m.title||'Refuel',m.message||'');
 }catch(e){   // Offline this would pile up every 30s and push useful entries out of the log.
  if(alertState.ok!==false){rlog('warn','PC alert check failed: '+(e&&e.message||e));alertState.ok=false;}
 }
}
// ---- Alert diagnostics, so nothing has to wait five hours for a real reset ----
async function exactAlarmState(){
 const LN=nativeLN();if(!LN||!LN.checkExactNotificationSetting)return null;
 try{return (await LN.checkExactNotificationSetting()).exact_alarm;}catch(e){return null;}
}
async function notifDiag(){
 const LN=nativeLN();
 if(!LN)return 'Only available in the native app. This is the web version.';
 let perm='?',exact='?',pend=[];
 try{perm=(await LN.checkPermissions()).display;}catch(_){}
 exact=await exactAlarmState()||'?';
 try{pend=(await LN.getPending()).notifications||[];}catch(_){}
 const resets=pend.filter(n=>n.id>=RESET_ID_MIN&&n.id<=RESET_ID_MAX);
 const when=resets.map(n=>{const t=n.schedule&&n.schedule.at;return t?new Date(t).toLocaleString():'?';});
 return [
  'Notifications: '+(perm==='granted'?'allowed ✅':perm+' ❌'),
  'Exact alarms: '+(exact==='granted'?'allowed ✅':'off ⚠ alerts can be delayed by tens of minutes'),
  'Scheduled reset alerts: '+resets.length+(when.length?' → '+when.join(', '):''),
  'One-off alerts pending: '+(pend.length-resets.length)
 ].join('\n');
}
async function selfTest(btn){
 const LN=nativeLN();
 if(!LN){alert('Only available in the native app.');return;}
 if(!await ensurePerm()){alert('Notification permission is required.');return;}
 await ensureChannel();
 const at=new Date(Date.now()+60000);
 try{
  // Scheduled exactly like a reset alert but one minute out, so closing the app proves
  // the real thing in a minute.
  await LN.schedule({notifications:[{id:9999,title:'Refuel scheduled test',
    body:'If this arrived with the app closed, reset alerts will arrive too.',
    channelId:CH,schedule:{at,allowWhileIdle:true}}]});
  rlog('info','scheduled test in 1 min: '+at.toLocaleTimeString());
  if(btn)btn.textContent='Scheduled for '+at.toLocaleTimeString()+'. Now close the app completely.';
 }catch(e){rlog('error','scheduled test failed: '+(e&&e.message||e));alert('Failed: '+(e&&e.message||e));}
}
async function testNotif(btn){
 const LN=nativeLN();
 if(LN){
  try{if(!await ensurePerm()){alert('Notification permission is required.');return;}
   await ensureChannel();
   await LN.schedule({notifications:[{id:9,title:'Refuel test',body:'If you can see this, alerts work.',channelId:CH,schedule:{at:new Date(Date.now()+1200)}}]});
   rlog('info','test alert scheduled');if(btn)btn.textContent='Sent';}
  catch(e){rlog('error','test alert failed: '+(e&&e.message||e));alert('Failed: '+(e&&e.message||e));}
 }else if('Notification'in window){
  try{if(Notification.permission!=='granted')await Notification.requestPermission();new Notification('Refuel test',{body:'If you can see this, alerts work.'});if(btn)btn.textContent='Sent';}
  catch(e){alert('Alert failed: '+e);}
 }else alert('This environment does not support notifications.');
}

 return `<label style="display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-top:1px solid var(--bd)">
   <span>${label}</span><input type="checkbox" data-k="${key}" ${on?'checked':''} style="width:22px;height:22px"></label>`;
}

 ov.innerHTML=`<div class="top"><div class="brand">Settings</div><button id="setclose" style="background:none;border:0;color:var(--tx);font-size:22px">✕</button></div>

   <div id="diagbox" style="background:var(--track);border-radius:8px;padding:8px;margin-top:8px;font-size:11px;white-space:pre-wrap;line-height:1.6">Checking…</div>

   <span style="color:var(--mut);font-size:11px;display:block;margin-top:6px">This is scheduled exactly like a reset alert. Close the app completely and wait one minute.</span>
   <span style="color:var(--warn);font-size:11px;display:block;margin-top:6px">⚠ Nothing arrived? Set <b>Settings → Apps → Refuel → Battery → Unrestricted</b>. Samsung, Xiaomi and others kill scheduled alerts to save power.</span></div>
  <div class="setup"><b>🩺 Diagnostic log</b>
   <div id="logbox" style="max-height:150px;overflow:auto;background:var(--track);border-radius:8px;padding:8px;margin-top:8px;font-size:10px;font-family:Consolas,monospace;white-space:pre-wrap"></div>
   <button id="logshare">Share</button> <button id="logcopy">Copy</button> <button id="logclear">Clear</button></div>
  ${PAIRED?`<div class="setup"><b>Advanced</b><br><span style="color:var(--mut);font-size:11px">Topic, if you also want it in the ntfy app: <code>${esc(T)}-a</code></span> <button id="cpbtn">Copy</button></div>`:''}
  <div class="setup"><button id="s_demo" style="width:100%">🎬 View demo</button></div>`;
 document.body.append(ov);
 $('#setclose').onclick=()=>ov.remove();
 ov.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{localStorage[c.dataset.k]=c.checked?'1':'0';rlog('info','setting '+c.dataset.k+'='+c.checked);if(state)scheduleLocalNotifs(state.agents,true);});
 const a1=$('#s_scan');if(a1)a1.onclick=startScan;
 const a2=$('#s_unpair');if(a2)a2.onclick=()=>{if(confirm('Disconnect? You will need to scan the QR again on your PC.')){delete localStorage.rf_t;delete localStorage.rf_k;rlog('info','Disconnect');location.reload();}};
 const a3=$('#s_test');if(a3)a3.onclick=()=>testNotif(a3);
 const refreshDiag=async()=>{
  const box=$('#diagbox');if(!box)return;
  box.textContent=await notifDiag();

 };
 refreshDiag();
 const ex=$('#s_exact');if(ex)ex.onclick=async()=>{
  const LN=nativeLN();if(!LN||!LN.changeExactNotificationSetting)return;
  try{await LN.changeExactNotificationSetting();}catch(e){rlog('warn','exact alarm setting failed: '+e);}
  if(state)await scheduleLocalNotifs(state.agents,true);   // reschedule as an exact alarm once granted
  refreshDiag();
 };
 const stb=$('#s_selftest');if(stb)stb.onclick=async()=>{await selfTest(stb);refreshDiag();};
 const a4=$('#s_demo');if(a4)a4.onclick=()=>{location.hash='demo';location.reload();};

 const lb=$('#logbox');if(lb)lb.textContent=logTail();
 const ls=$('#logshare');if(ls)ls.onclick=async()=>{try{if(navigator.share){await navigator.share({title:'Refuel diagnostic log',text:logReport()});}else{await navigator.clipboard.writeText(logReport());ls.textContent='Copied!';}}catch(e){rlog('warn','share cancelled/failed: '+e)}};
 const lc=$('#logcopy');if(lc)lc.onclick=async()=>{try{await navigator.clipboard.writeText(logReport());lc.textContent='Copied!';}catch(e){}};

function tickCount(){
 const now=Date.now()/1000;
 document.querySelectorAll('.count').forEach(el=>{
  const r=parseFloat(el.dataset.reset);
  if(r&&r>now)el.textContent=dur(r-now);
 });
}
async function poll(){
 if(!T||!K)return render();
 try{
  const res=await fetch(`${SV}/${encodeURIComponent(T)}-s/json?poll=1&since=all`,{cache:'no-store'});
  const lines=(await res.text()).trim().split('\n').filter(Boolean);
  let bad=0;
  for(let i=lines.length-1;i>=0;i--){
   try{
    const m=JSON.parse(lines[i]);
    if(m.event==='message'){state=await decrypt(m.message);lastFetch=Date.now();
     applyTheme(state.accent);break}
   }catch(e){bad++/* undecryptable: forged or an old version, ignore */}
  }
  if(bad&&!pollState.badLogged){rlog('warn','ignored '+bad+' undecryptable message(s) (key mismatch or old version) - re-pairing may be needed');pollState.badLogged=true}
  if(state&&!pollState.ok){rlog('info','received PC status ('+(state.agents||[]).length+' agent(s))');pollState.ok=true}
  render();
  if(state)scheduleLocalNotifs(state.agents);
  const age=state?Math.round((Date.now()/1000)-num(state.ts)):null;
  $('#meta').innerHTML=state?(age>1200?`<span class="stale">PC replied ${Math.round(age/60)}m ago</span>`:`synced ${new Date(lastFetch).toLocaleTimeString()} 🔒`):'Waiting';
 }catch(e){$('#meta').textContent='Connection failed. Offline?';
  if(pollState.ok!==false){rlog('error','relay connection failed: '+(e&&e.message||e));pollState.ok=false}}
}
rlog('info','app start · '+(DEMO?'demo':PAIRED?'live':'not connected'));
{const g=$('#gear');if(g)g.onclick=openSettings;}
if(DEMO){state=demoState();render();$('#meta').textContent='Demo';setInterval(tickCount,1000);}
else{
 render();poll();setInterval(poll,30000);setInterval(tickCount,1000);
 // Alert polling is kept separate from status polling. Status needs the key to decrypt
 // and throws on failure, which would otherwise take PC alerts down with it.
 pollAlerts();setInterval(pollAlerts,30000);
}
